name: Publish results

# Publishes the committed execution results (HTML reports, SQL screenshots and outputs) to GitHub Pages so reviewers can
# open them in a browser without cloning. The site is rebuilt from what is in the repository, not from a CI test run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site from committed evidence
        run: |
          mkdir -p _site/reports _site/sql
          cp docs/site/index.html _site/index.html
          for profile in api ui sql default self-healing; do
            mkdir -p "_site/reports/$profile"
            cp "reports/$profile/cucumber-report.html" "_site/reports/$profile/" 2>/dev/null || true
            cp "reports/$profile/junit.xml" "_site/reports/$profile/" 2>/dev/null || true
          done
          cp -R sql/screenshots sql/outputs _site/sql/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
