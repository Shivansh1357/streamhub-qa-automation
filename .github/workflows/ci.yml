name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  TEST_ENV: ci
  CI: true

jobs:
  quality:
    name: Type-check, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  api-tests:
    name: API tests (Playwright + Cucumber)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run test:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: reports/api

  ui-tests:
    name: UI tests against emicalculator.net
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-report
          path: |
            reports/ui
            !reports/ui/videos

  sql-tests:
    name: SQL scenario tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: streamhub_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run test:sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-test-report
          path: reports/sql

  self-healing-demo:
    name: Self-healing locator demo (expected failures + offline heal)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npx playwright install --with-deps chromium
      - name: Run the deliberately broken suite (failures are expected)
        run: npm run test:self-healing
        continue-on-error: true
      - name: Propose fixes without applying them
        run: npm run heal -- --provider offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-healing-report
          path: reports/self-healing
